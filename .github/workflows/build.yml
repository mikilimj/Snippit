name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  RCLONE_VERSION: "1.74.3"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      # BtbN publishes to a fixed "latest" tag that it overwrites in place, so the
      # download URL never changes even when the artifact does — the asset's ETag
      # is the only stable signal of its actual content, so it's what keys the cache
      # (a plain URL-based key would cache the very first ffmpeg build forever).
      - name: Resolve ffmpeg asset ETag (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        id: ffmpeg-etag
        run: |
          etag=$(curl -sIL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            | grep -i '^etag:' | tail -1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r')
          echo "etag=$etag" >> "$GITHUB_OUTPUT"

      - name: Cache ffmpeg/ffprobe sidecars (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-sidecars-linux64-gpl-${{ steps.ffmpeg-etag.outputs.etag }}

      - name: Stage ffmpeg/ffprobe sidecars (Linux)
        if: matrix.platform == 'ubuntu-22.04' && steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -L -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir -p ffmpeg-extract src-tauri/binaries
          tar -xf ffmpeg.tar.xz -C ffmpeg-extract --strip-components=1
          cp ffmpeg-extract/bin/ffmpeg src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp ffmpeg-extract/bin/ffprobe src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/*

      # Runs even on ffmpeg cache hits: caches saved before rclone became a
      # sidecar contain only ffmpeg/ffprobe, so presence is checked per run.
      - name: Stage rclone sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          if [ ! -f src-tauri/binaries/rclone-x86_64-unknown-linux-gnu ]; then
            curl -L -o rclone.zip "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip"
            mkdir -p src-tauri/binaries
            unzip -j rclone.zip '*/rclone' -d src-tauri/binaries
            mv src-tauri/binaries/rclone src-tauri/binaries/rclone-x86_64-unknown-linux-gnu
            chmod +x src-tauri/binaries/rclone-x86_64-unknown-linux-gnu
          fi

      - name: Resolve ffmpeg asset ETag (Windows)
        if: matrix.platform == 'windows-latest'
        id: ffmpeg-etag-windows
        shell: pwsh
        run: |
          $resp = Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -Method Head
          $etag = $resp.Headers['ETag'] -replace '"', ''
          echo "etag=$etag" >> $env:GITHUB_OUTPUT

      - name: Cache ffmpeg/ffprobe sidecars (Windows)
        if: matrix.platform == 'windows-latest'
        id: cache-ffmpeg-windows
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-sidecars-win64-gpl-${{ steps.ffmpeg-etag-windows.outputs.etag }}

      - name: Stage ffmpeg/ffprobe sidecars (Windows)
        if: matrix.platform == 'windows-latest' && steps.cache-ffmpeg-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $dir = Get-ChildItem -Directory ffmpeg-extract | Select-Object -First 1
          Copy-Item "$($dir.FullName)/bin/ffmpeg.exe" "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          Copy-Item "$($dir.FullName)/bin/ffprobe.exe" "src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe"

      - name: Stage rclone sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/binaries/rclone-x86_64-pc-windows-msvc.exe")) {
            Invoke-WebRequest -Uri "https://downloads.rclone.org/v$env:RCLONE_VERSION/rclone-v$env:RCLONE_VERSION-windows-amd64.zip" -OutFile rclone.zip
            Expand-Archive rclone.zip -DestinationPath rclone-extract
            New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
            $dir = Get-ChildItem -Directory rclone-extract | Select-Object -First 1
            Copy-Item "$($dir.FullName)/rclone.exe" "src-tauri/binaries/rclone-x86_64-pc-windows-msvc.exe"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to release
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          releaseId: ${{ github.event.release.id }}

      - name: Build (manual test run)
        if: github.event_name != 'release'
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload artifacts (manual test run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: clipsnip-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error

  # Pushes version bumps for both AUR packages (clipsnip builds the release
  # tag from source, clipsnip-bin repacks the .deb uploaded by the build job).
  # Needs the AUR_SSH_PRIVATE_KEY secret: the private half of an SSH key whose
  # public half is registered on the AUR account that owns both packages.
  publish-aur:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set release version in PKGBUILDs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          # The deb asset name is resolved from the release rather than assumed,
          # so a bundler naming change fails loudly here instead of on the AUR.
          deb_asset=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | grep '_amd64\.deb$')
          test -n "$deb_asset"
          sed -i "s/^pkgver=.*/pkgver=$version/; s/^pkgrel=.*/pkgrel=1/" \
            packaging/aur/clipsnip/PKGBUILD packaging/aur/clipsnip-bin/PKGBUILD
          sed -i "s|^source=(.*|source=(\"\$url/releases/download/v\$pkgver/$deb_asset\")|" \
            packaging/aur/clipsnip-bin/PKGBUILD

      - name: Publish clipsnip to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: clipsnip
          pkgbuild: packaging/aur/clipsnip/PKGBUILD
          assets: packaging/aur/clipsnip/clipsnip.desktop
          updpkgsums: true
          commit_username: mikilimj
          commit_email: milosz@medportal.pl
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.event.release.tag_name }}"

      - name: Publish clipsnip-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: clipsnip-bin
          pkgbuild: packaging/aur/clipsnip-bin/PKGBUILD
          updpkgsums: true
          commit_username: mikilimj
          commit_email: milosz@medportal.pl
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.event.release.tag_name }}"
